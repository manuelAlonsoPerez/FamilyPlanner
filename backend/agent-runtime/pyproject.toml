[project]
name = "family-planner-agent"
version = "0.1.0"
description = "Strands scheduling agent runtime for Family Planner"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bedrock-agentcore>=1.22.0",
    "boto3>=1.43.80",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "strands-agents>=1.53.0",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "ASYNC",
  "S",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["family_planner_agent"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
